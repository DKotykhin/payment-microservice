syntax = "proto3";
package payment.v1;

service PaymentService {
  rpc CreatePaymentIntent(CreatePaymentIntentRequest) returns (CreatePaymentIntentResponse);
  rpc CreateCheckoutSession(CreateCheckoutSessionRequest) returns (CreateCheckoutSessionResponse);
  rpc GetPayment(GetPaymentRequest) returns (PaymentResponse);
  rpc GetPaymentsByOrder(GetPaymentsByOrderRequest) returns (GetPaymentsResponse);
  rpc GetPaymentsByUser(GetPaymentsByUserRequest) returns (GetPaymentsResponse);
  rpc RefundPayment(RefundPaymentRequest) returns (PaymentResponse);
  rpc CancelPayment(CancelPaymentRequest) returns (PaymentResponse);
}

message CreatePaymentIntentRequest {
  string              order_id = 1;
  string              user_id  = 2;
  int32               amount   = 3;      // in smallest currency unit (cents)
  string              currency = 4;      // e.g. "usd"
  map<string, string> metadata = 5;
}

message CreatePaymentIntentResponse {
  string payment_id               = 1;
  string client_secret            = 2;
  string stripe_payment_intent_id = 3;
  string status                   = 4;
}

message CreateCheckoutSessionRequest {
  string              order_id    = 1;
  string              user_id     = 2;
  int32               amount      = 3;
  string              currency    = 4;
  string              success_url = 5;
  string              cancel_url  = 6;
  map<string, string> metadata    = 7;
}

message CreateCheckoutSessionResponse {
  string payment_id        = 1;
  string session_url       = 2;
  string stripe_session_id = 3;
  string status            = 4;
}

message GetPaymentRequest {
  string payment_id = 1;
}

message GetPaymentsByOrderRequest {
  string order_id = 1;
  int32  page     = 2;
  int32  limit    = 3;
}

message GetPaymentsByUserRequest {
  string user_id = 1;
  int32  page    = 2;
  int32  limit   = 3;
}

message RefundPaymentRequest {
  string payment_id = 1;
  int32  amount     = 2;
  string reason     = 3;
}

message CancelPaymentRequest {
  string payment_id = 1;
}

message PaymentResponse {
  string id                         = 1;
  string order_id                   = 2;
  string user_id                    = 3;
  string stripe_payment_intent_id   = 4;
  string stripe_checkout_session_id = 5;
  string stripe_refund_id           = 6;
  int32  amount                     = 7;
  int32  refunded_amount            = 8;
  string currency                   = 9;
  string status                     = 10;
  string created_at                 = 11;
  string updated_at                 = 12;
}

message GetPaymentsResponse {
  repeated PaymentResponse payments = 1;
  int32                    total    = 2;
  int32                    page     = 3;
  int32                    limit    = 4;
}

// Command to generate TypeScript code with NestJS options
// protoc -I ./proto ./proto/payment.proto --ts_proto_out=./src/generated-types --ts_proto_opt=nestJs=true